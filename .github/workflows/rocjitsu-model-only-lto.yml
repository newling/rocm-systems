name: rocjitsu-model-only-lto

on:
  pull_request:
    paths:
      - "emulation/rocjitsu/**"
      - "emulation/mirage/**"
      - "runtimes/api-headers/**"
      - ".github/workflows/rocjitsu-model-only-lto.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-only-lto:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            linker_flags: ""
          - cc: clang
            cxx: clang++
            linker_flags: "-fuse-ld=lld"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: |
            emulation/rocjitsu
            emulation/mirage
            runtimes/api-headers
            shared/machine-readable-isa/isa
      - name: Install compiler and linker tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm g++ ninja-build
      - name: Configure Release with LTO
        shell: bash
        run: |
          cmake -S emulation/rocjitsu -B build-model-only-lto -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLTO=ON -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DROCM_PATH= \
            -DFETCHCONTENT_BASE_DIR="${RUNNER_TEMP}/model-only-deps" \
            | tee configure.log
          # CMake can fall back to a non-LTO build when IPO is unsupported.
          grep -F "LTO enabled for Release and RelWithDebInfo" configure.log
      - name: Build model-only consumers
        run: |
          cmake --build build-model-only-lto --parallel 2 --target \
            rocjitsu_model_only_test rocjitsu_narrow_isa_registry_fixture \
            rocjitsu_analysis_tests waitcheck_stream_test \
            rocjitsu_gfx1250_b0_to_a0 rj_decode_fuzz rj_code_object_fuzz
      - name: Test decoding and model-only symbol boundaries
        run: |
          ctest --test-dir build-model-only-lto --output-on-failure --no-tests=error \
            -R '^(ModelOnlyIsaTest\.|(StaticAnalysis|WaitcheckStream|Gfx1250B0ToA0Library|DecodeFuzzModelOnly|CodeObjectFuzzModelOnly)\.SymbolBoundary$|IsaRegistryCompositionTest\.NarrowSymbolBoundary$)'
